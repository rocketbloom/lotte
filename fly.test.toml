app = 'lotte-test'
primary_region = 'ams'

[build]

[env]
  PHX_HOST = "lotte-test.fly.dev"
  PHX_SERVER = "true"
  ECTO_IPV6 = "true"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "10s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/health/"

[checks]
  [checks.status]
    port = 4000
    type = "tcp"
    interval = "10s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[deploy]
  release_command = "/app/bin/migrate"
