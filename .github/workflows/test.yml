name: Test

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: setup-beam
        with:
          otp-version: "28.1"
          elixir-version: "1.18.4"

      - name: Cache deps + build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ steps.setup-beam.outputs.otp-version }}-elixir${{ steps.setup-beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.setup-beam.outputs.otp-version }}-elixir${{ steps.setup-beam.outputs.elixir-version }}-

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Install matching ChromeDriver
        run: |
          CHROME_VERSION="${{ steps.setup-chrome.outputs.chrome-version }}"
          echo "Chrome version: $CHROME_VERSION"
          DRIVER_URL=$(curl -s https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json \
            | jq -r --arg v "$CHROME_VERSION" '.versions[] | select(.version == $v) | .downloads.chromedriver[] | select(.platform == "linux64") | .url')
          if [ -z "$DRIVER_URL" ]; then
            echo "No exact match for $CHROME_VERSION; falling back to latest patch in same major.minor.build"
            BASE=$(echo "$CHROME_VERSION" | awk -F. '{print $1"."$2"."$3}')
            DRIVER_URL=$(curl -s https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json \
              | jq -r --arg b "$BASE" '[.versions[] | select(.version | startswith($b))] | last | .downloads.chromedriver[] | select(.platform == "linux64") | .url')
          fi
          echo "ChromeDriver URL: $DRIVER_URL"
          curl -sSL "$DRIVER_URL" -o /tmp/chromedriver.zip
          unzip -o /tmp/chromedriver.zip -d /tmp/chromedriver
          sudo mv /tmp/chromedriver/chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          chromedriver --version

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test
